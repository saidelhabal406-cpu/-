// ===== صيدلية الحراسة =====
const gardeSchedule = ["صيدلية الفتح","صيدلية أبوزيد","صيدلية السوق","صيدلية إراك","صيدلية طريق كلميم","صيدلية الأمل","صيدلية أسفار ن إسفارن"];
const today = new Date().getDay(); // 0=Sun, 6=Sat
const gardePharmacy = pharmacies.find(p => p.name_ar === gardeSchedule[today % gardeSchedule.length]);
document.getElementById("garde").innerHTML = `
<h2>صيدلية الحراسة اليوم 🌙</h2>
<h3>${gardePharmacy.name_ar} | ${gardePharmacy.name_fr} | ${gardePharmacy.name_en}</h3>
<p>📍 ${gardePharmacy.address}</p>
<a href="tel:${gardePharmacy.phone}">📞 ${gardePharmacy.phone}</a>
`;

// ===== عرض جميع الصيدليات =====
const container = document.getElementById("pharmacies");
const details = document.getElementById("details");

function displayPharmacies(list){
    container.innerHTML = "";
    list.forEach(p=>{
        container.innerHTML += `<div class="pharmacy" onclick="showDetails('${p.name_ar}')">
            <h3>${p.name_ar} | ${p.name_fr} | ${p.name_en}</h3>
        </div>`;
    });
}

function showDetails(name){
    const p = pharmacies.find(ph=>ph.name_ar===name);
    details.innerHTML = `<div class="details">
        <h3>${p.name_ar} | ${p.name_fr} | ${p.name_en}</h3>
        <p>📍 ${p.address}</p>
        <a href="tel:${p.phone}">📞 ${p.phone}</a>
    </div>`;
}

displayPharmacies(pharmacies);

// ===== بحث الصيدليات =====
document.getElementById("search").addEventListener("input", function(){
    const query = this.value.toLowerCase();
    const filtered = pharmacies.filter(p => 
        p.name_ar.toLowerCase().includes(query) || 
        p.name_fr.toLowerCase().includes(query) || 
        p.name_en.toLowerCase().includes(query) || 
        p.address.toLowerCase().includes(query)
    );
    displayPharmacies(filtered);
});
</script>
